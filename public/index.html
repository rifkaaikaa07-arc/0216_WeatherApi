<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lokasi</title>
    <style>
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .wrapper {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        h3 {
            margin: 4px 0;
            font-size: 0.95rem;
            color: #64748b;
            font-weight: 500;
        }
        hr {
            border: 0;
            border-top: 1px solid #e2e8f0;
            margin: 16px 0;
        }
        .baris {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 0.95rem;
        }
        .baris span:first-child {
            color: #64748b;
        }
        .search-box {
            margin-top: 20px;
            display: flex;
            gap: 8px;
        }
        input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            font-size: 0.9rem;
        }
        input:focus {
            border-color: #94a3b8;
        }
        button {
            padding: 8px 16px;
            background-color: #0f172a;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
        }
        button:hover {
            background-color: #1e293b;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <h3>Nama : Rifka</h3>
        <h3>NIM : 20250140216</h3>

        <hr>

        <div class="baris"><span>Negara</span><span id="negara">-</span></div>
        <div class="baris"><span>Provinsi</span><span id="provinsi">-</span></div>
        <div class="baris"><span>Kecamatan</span><span id="kecamatan">-</span></div>
        <div class="baris"><span>Longitude</span><span id="longitude">-</span></div>
        <div class="baris"><span>Latitude</span><span id="latitude">-</span></div>

        <div class="search-box">
            <input type="text" id="inputLokasi" placeholder="Lokasi" value="Bandung">
            <button onclick="cariLokasi()">Cari</button>
        </div>
    </div>

    <script>
        function cariLokasi() {
            const kota = document.getElementById("inputLokasi").value;

            fetch("/api/lokasi?kota=" + encodeURIComponent(kota))
                .then(response => response.json())
                .then(data => {
                    console.log(data);
                    if (data.message) {
                        alert(data.message);
                        return;
                    }
                    document.getElementById("negara").innerText = data.negara;
                    document.getElementById("provinsi").innerText = data.provinsi;
                    document.getElementById("kecamatan").innerText = data.kecamatan;
                    document.getElementById("longitude").innerText = data.longitude;
                    document.getElementById("latitude").innerText = data.latitude;
                })
                .catch(error => console.error(error));
        }

        cariLokasi();

        document.getElementById("inputLokasi").addEventListener("keypress", function (e) {
            if (e.key === "Enter") cariLokasi();
        });
    </script>
</body>
</html>
